name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh GitHub favorite health"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./postsoma-devlibrary
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./postsoma-devlibrary/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test --if-present

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_GA_ROLLUP_ID: ${{ vars.NEXT_PUBLIC_GA_ROLLUP_ID || 'G-NZ2V582QTN' }}
          NEXT_PUBLIC_GA_PROJECT_ID: ${{ vars.NEXT_PUBLIC_GA_PROJECT_ID || 'G-DDSKE86NG1' }}
          NEXT_PUBLIC_GA_PROJECT_NAME: ${{ vars.NEXT_PUBLIC_GA_PROJECT_NAME || 'dev_library' }}
          NEXT_PUBLIC_GA_COGNITIVE_LAYER: ${{ vars.NEXT_PUBLIC_GA_COGNITIVE_LAYER || 'Craft' }}
          NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.NEXT_PUBLIC_UMAMI_WEBSITE_ID || 'edb495ae-9e74-4b84-afe5-7482ed6a58d5' }}
          NEXT_PUBLIC_UMAMI_SCRIPT_URL: ${{ vars.NEXT_PUBLIC_UMAMI_SCRIPT_URL || 'https://pulse.postsoma-2050.website/pulse.js' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./postsoma-devlibrary/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
